<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F5E9DA" />
  <meta name="description" content="Círculo de Sabores — Barras saludables artesanales. Compra por unidad o en packs con descuento." />
  <title>Círculo de Sabores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar" style="display:none">
    <button class="nav-logo-btn" onclick="App.navigate('home')">
      <img src="images/logo.png" alt="Círculo de Sabores" class="nav-logo"
           onerror="this.style.display='none';document.getElementById('nav-brand').style.display='flex'" />
      <span id="nav-brand" class="nav-brand" style="display:none">🌿 Círculo</span>
    </button>
    <div class="nav-actions">
      <button class="nav-btn" onclick="App.navigate('encargos')" title="Encargos">
        <i class="fa-solid fa-clipboard-list"></i>
      </button>
      <button class="nav-btn cart-btn" onclick="App.navigate('carrito')" title="Carrito">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-badge" class="cart-badge hidden">0</span>
      </button>
    </div>
  </nav>

  <!-- APP CONTAINER -->
  <main id="app" class="app-container"></main>

  <!-- FOOTER NAV -->
  <footer id="footer-nav" class="footer-nav" style="display:none">
    <button class="foot-btn" onclick="App.navigate('home')" data-view="home">
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </button>
    <button class="foot-btn" onclick="App.navigate('encargos')" data-view="encargos">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>Encargos</span>
    </button>
    <button class="foot-btn cart-foot-btn" onclick="App.navigate('carrito')" data-view="carrito">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Carrito</span>
      <span id="foot-cart-count" class="foot-cart-count hidden">0</span>
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
