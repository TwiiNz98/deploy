<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F5E9DA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Círculo de Sabores" />
  <link rel="manifest" href="manifest.json" />
  <meta name="description" content="Círculo de Sabores — Barras saludables artesanales. Compra por unidad o en packs con descuento." />
  <title>Círculo de Sabores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar" style="display:none">
    <button class="nav-logo-btn" id="nav-logo-btn" onclick="App._logoClick()">
      <span class="nav-brand-text">Círculo de Sabores</span>
    </button>
    <div class="nav-actions">
      <div id="cart-badge-nav" class="cart-badge-nav hidden">0</div>
      <button class="nav-btn ham-btn" id="ham-btn" onclick="App.toggleMenu()" title="Menú">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </nav>

  <!-- HAMBURGER OVERLAY -->
  <div class="ham-overlay" id="ham-overlay" onclick="App.closeMenu()"></div>

  <!-- HAMBURGER MENU PANEL -->
  <div class="ham-menu" id="ham-menu">
    <div class="ham-menu-header">
      <span class="ham-menu-logo">🌿 Círculo de Sabores</span>
      <button class="ham-close-btn" onclick="App.closeMenu()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <nav class="ham-nav-links">
      <button class="ham-nav-item" onclick="App.closeMenu(); App.navigate('home')">
        <i class="fa-solid fa-store"></i>
        <span>Ver Productos</span>
        <i class="fa-solid fa-chevron-right ham-arrow"></i>
      </button>
      <button class="ham-nav-item" onclick="App.closeMenu(); App.navigate('pedidos')">
        <i class="fa-solid fa-clipboard-list"></i>
        <span>Mis Pedidos</span>
        <i class="fa-solid fa-chevron-right ham-arrow"></i>
      </button>
      <button class="ham-nav-item" onclick="App.closeMenu(); App.navigate('encargos')">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Realizar Encargos</span>
        <i class="fa-solid fa-chevron-right ham-arrow"></i>
      </button>
      <button class="ham-nav-item" onclick="App.closeMenu(); App.navigate('carrito')">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Mi Carrito</span>
        <i class="fa-solid fa-chevron-right ham-arrow"></i>
      </button>
    </nav>
    <div class="ham-divider"></div>
    <div class="ham-social">
      <a href="https://instagram.com/circulodesabores_cl" target="_blank" rel="noopener" class="ham-social-btn ham-ig">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://wa.me/56950147783" target="_blank" rel="noopener" class="ham-social-btn ham-wa">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>
    <div class="ham-pwa-wrap" id="ham-pwa-wrap" style="display:none">
      <button class="ham-pwa-btn" onclick="App.installPWA()">
        <i class="fa-solid fa-download"></i>
        <span>Instalar App</span>
      </button>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <main id="app" class="app-container"></main>

  <!-- FOOTER NAV -->
  <footer id="footer-nav" class="footer-nav" style="display:none">
    <button class="foot-btn" onclick="App.navigate('home')" data-view="home">
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </button>
    <button class="foot-btn" onclick="App.navigate('encargos')" data-view="encargos">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>Encargos</span>
    </button>
    <button class="foot-btn cart-foot-btn" onclick="App.navigate('carrito')" data-view="carrito">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Carrito</span>
      <span id="foot-cart-count" class="foot-cart-count hidden">0</span>
    </button>
  </footer>

  <!-- ADMIN PANEL OVERLAY -->
  <div class="admin-panel" id="admin-panel" style="display:none">
    <div class="admin-header">
      <button class="admin-back-btn" onclick="Admin.close()">
        <i class="fa-solid fa-chevron-left"></i> Salir
      </button>
      <h2 class="admin-title">⚙️ Panel Admin</h2>
      <div></div>
    </div>
    <div class="admin-tabs-bar" id="admin-tabs-bar">
      <button class="admin-tab active" onclick="Admin.showTab('productos', this)">
        <i class="fa-solid fa-box-open"></i> Productos
      </button>
      <button class="admin-tab" onclick="Admin.showTab('pedidos', this)">
        <i class="fa-solid fa-clipboard-list"></i> Pedidos
      </button>
      <button class="admin-tab" onclick="Admin.showTab('cupones', this)">
        <i class="fa-solid fa-ticket"></i> Cupones
      </button>
      <button class="admin-tab" onclick="Admin.showTab('entrega', this)">
        <i class="fa-solid fa-truck"></i> Entrega
      </button>
      <button class="admin-tab" onclick="Admin.showTab('contenido', this)">
        <i class="fa-solid fa-pen-to-square"></i> Contenido
      </button>
    </div>
    <div class="admin-body" id="admin-body">
      <!-- Populated by Admin.showTab() -->
    </div>
  </div>

  <script src="data-layer.js"></script>
  <script src="app.js"></script>
</body>
</html>
