  <style>
    html, body { overflow: auto !important; height: auto !important; }
    .page-scroll { padding-top: var(--navbar-h); padding-bottom: calc(var(--footer-h) + 8px); min-height: 100vh; background: var(--bg); }
    .nav-back-btn { width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:.88rem;box-shadow:var(--shadow-s);text-decoration:none; }
    .delivery-banner { margin: 12px 16px 0; }
    .sticky-filters { position:sticky;top:var(--navbar-h);z-index:50;background:var(--bg);padding-bottom:4px; }
    .delivery-highlight { color:var(--success); }

    /* ── PRODUCT MODAL ── */
    .modal-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:400;display:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px); }
    .modal-backdrop.open { display:block; }
    .product-modal { position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;z-index:401;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom); }
    .product-modal::-webkit-scrollbar { display:none; }
    .product-modal.open { transform:translateY(0); }
    .modal-handle-wrap { display:flex;justify-content:center;padding:12px 0 4px;position:sticky;top:0;background:var(--surface);z-index:2; }
    .modal-handle { width:36px;height:4px;border-radius:2px;background:var(--border); }
    .modal-close-btn { position:absolute;top:10px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--bg);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:.85rem;z-index:3; }
    .modal-img { width:100%;aspect-ratio:4/3;background:linear-gradient(140deg,var(--navbar) 0%,var(--accent-l) 100%);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center; }
    .modal-img img { width:100%;height:100%;object-fit:cover;position:absolute;inset:0; }
    .modal-body { padding:18px 16px 24px; }

    /* ── CART MODAL ── */
    /* Reutiliza .modal-backdrop y .product-modal con z-index mayor */
    #cart-backdrop { z-index:402; }
    #cart-modal   { z-index:403; }

    /* Filas de ítems del carrito */
    .crt-item {
      display:flex; align-items:center; gap:10px;
      padding:12px 0; border-bottom:1px solid var(--border);
    }
    .crt-emoji { font-size:1.5rem; flex-shrink:0; }
    .crt-info  { flex:1; min-width:0; }
    .crt-name  { font-weight:600; font-size:.88rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .crt-type  { font-size:.75rem; color:var(--text-3); margin-top:2px; }
    .crt-price { font-weight:700; font-size:.9rem; color:var(--primary); flex-shrink:0; }
    .crt-rm    {
      width:28px; height:28px; border-radius:50%;
      background:var(--bg); color:var(--text-3);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; flex-shrink:0; cursor:pointer;
      border: 1px solid var(--border);
      transition: background .15s, color .15s;
    }
    .crt-rm:active { background:var(--error); color:#fff; border-color:var(--error); }
    .crt-total-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 0 10px;
      font-weight:700; font-size:1rem; color:var(--text);
    }
    .crt-delivery-ok {
      display:flex; align-items:center; gap:8px;
      font-size:.8rem; color:var(--success); margin-bottom:4px;
    }
    .crt-delivery-pending { font-size:.8rem; color:var(--text-2); margin-bottom:4px; }
    .crt-empty {
      text-align:center; padding:40px 16px;
    }
    .crt-empty-icon { font-size:3rem; margin-bottom:14px; }
    .crt-empty-title { font-family:var(--font-display); font-size:1.3rem; color:var(--text); margin-bottom:8px; }
    .crt-empty-sub { font-size:.88rem; color:var(--text-2); }

    /* ── FOOTER NAV ── */
    .page-footer-nav { position:fixed;bottom:0;left:0;right:0;height:var(--footer-h);background:rgba(245,233,218,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom); }
    .page-foot-btn { flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:.68rem;font-weight:500;letter-spacing:.02em;position:relative;text-decoration:none;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent; }
    .page-foot-btn i { font-size:1.15rem; }
    .page-foot-btn.active { color:var(--primary); }
    .page-foot-badge { position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;background:var(--primary);color:#fff;border-radius:8px;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px; }
    .page-foot-badge.hidden { display:none; }

    /* ── ARTESANAL BLOCK ── */
    .artesanal-block { position:relative;overflow:hidden;background:linear-gradient(135deg,#1a4a2e 0%,#2d6e46 50%,#1a4a2e 100%);padding:14px 20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;animation:artesanal-levitate 3.2s ease-in-out infinite;box-shadow:0 6px 28px rgba(26,74,46,.35); }
    .artesanal-shimmer { position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.18) 46%,rgba(255,255,255,.32) 50%,rgba(255,255,255,.18) 54%,transparent 70%);background-size:200% 100%;animation:shimmer-slide 2.8s ease-in-out infinite; }
    @keyframes shimmer-slide { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    @keyframes artesanal-levitate { 0%,100%{transform:translateY(0);box-shadow:0 6px 28px rgba(26,74,46,.35)}50%{transform:translateY(-3px);box-shadow:0 12px 38px rgba(26,74,46,.48)} }
    .artesanal-text { position:relative;z-index:2;font-family:var(--font-display);font-style:italic;font-size:1.1rem;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.3); }
    .artesanal-sub { position:relative;z-index:2;font-size:.68rem;color:rgba(255,255,255,.72);font-weight:500;letter-spacing:.06em;text-transform:uppercase; }
  </style>

      unit:  { units:1, price:p.priceUnit,  label:'1 unidad' },
      pack4: { units:4, price:p.pricePack4, label:'Pack x4'  },
      pack8: { units:8, price:p.pricePack8, label:'Pack x8'  },
    };
    return m[type] || m.unit;
  }

  function showCatToast(msg, icon = '✓') {
    $$('.toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2100);
  }

  /* ── CARRITO (CatCart) ─────────────────────────────────── */
  const CatCart = {
    _items: [],

    load()  { CatCart._items = DataLayer.cart.load(); },
    save()  { DataLayer.cart.save(CatCart._items); },
    total() { return CatCart._items.reduce((s, i) => s + i.priceTotal, 0); },
    count() { return CatCart._items.reduce((s, i) => s + i.qty, 0); },

    add(p, type, qty) {
      const info = getPackInfo(p, type);
      const ex   = CatCart._items.find(i => i.id === p.id && i.type === type);
      if (ex) {
        ex.qty += qty;
        ex.units      = ex.qty * info.units;
        ex.priceTotal = ex.qty * info.price;
      } else {
        CatCart._items.push({
          id: p.id, name: p.name, emoji: p.emoji,
          type, typeLabel: info.label, qty,
          units: qty * info.units,
          priceUnit: info.price,
          priceTotal: qty * info.price,
        });
      }
      CatCart.save();
      CatPage.refreshBadge();
      CatPage.refreshDeliveryBanner();
    },

    remove(id, type) {
      CatCart._items = CatCart._items.filter(i => !(i.id === id && i.type === type));
      CatCart.save();
      CatPage.refreshBadge();
      CatPage.refreshDeliveryBanner();
    },
  };

  /* ── ESTADO DEL CATÁLOGO ───────────────────────────────── */
  const CatState = {
    searchQuery: '',
    activeCategory: 'todos',
    activeTag: null,
    modalProduct: null,
    modalType: 'unit',
    modalQty: 1,
  };

  /* ── CARRITO MODAL ─────────────────────────────────────── */
  const CartModal = {
    open() {
      this.render();
      $('#cart-modal').classList.add('open');
      $('#cart-backdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
    },

    close() {
      $('#cart-modal').classList.remove('open');
      $('#cart-backdrop').classList.remove('open');
      document.body.style.overflow = '';
    },

    render() {
      const items = CatCart._items;
      const total = CatCart.total();
      const isFree = total >= DELIVERY_FREE_THRESHOLD;
      const remaining = DELIVERY_FREE_THRESHOLD - total;
      const content = $('#cart-modal-content');
      if (!content) return;

      if (items.length === 0) {
        content.innerHTML = `
          <div class="crt-empty">
            <div class="crt-empty-icon">🛒</div>
            <h3 class="crt-empty-title">Tu carrito está vacío</h3>
            <p class="crt-empty-sub">Agrega productos desde el catálogo para comenzar tu pedido.</p>
          </div>`;
        return;
      }

      const rows = items.map(item => `
        <div class="crt-item">
          <span class="crt-emoji">${item.emoji}</span>
          <div class="crt-info">
            <div class="crt-name">${item.name}</div>
            <div class="crt-type">${item.typeLabel} × ${item.qty}</div>
          </div>
          <span class="crt-price">${fmt(item.priceTotal)}</span>
          <button class="crt-rm" onclick="CartModal.remove('${item.id}','${item.type}')" aria-label="Eliminar ${item.name}">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>`).join('');

      const deliveryLine = isFree
        ? `<div class="crt-delivery-ok"><i class="fa-solid fa-circle-check"></i> ¡Delivery gratis activado! 🎉</div>`
        : `<div class="crt-delivery-pending">Agrega <strong>${fmt(remaining)}</strong> más para delivery gratis 🚚</div>`;

      content.innerHTML = `
        <div style="padding:8px 16px 28px">
          <h3 style="font-family:var(--font-display);font-size:1.4rem;color:var(--text);margin-bottom:4px">
            Mi Carrito
          </h3>
          ${rows}
          <div class="crt-total-row">
            <span>Total del pedido</span>
            <span>${fmt(total)}</span>
          </div>
          ${deliveryLine}
          <button class="btn-add-full" style="margin-top:16px;width:100%" onclick="CartModal.checkout()">
            <i class="fa-brands fa-whatsapp"></i>
            Pedir por WhatsApp · ${fmt(total)}
          </button>
        </div>`;
    },

    remove(id, type) {
      CatCart.remove(id, type);
      this.render();
    },

    checkout() {
      const items = CatCart._items;
      if (items.length === 0) return;
      const total = CatCart.total();
      const lines = items.map(i =>
        `  ${i.emoji} *${i.name}* — ${i.typeLabel} ×${i.qty}: ${fmt(i.priceTotal)}`
      ).join('\n');
      const now   = new Date();
      const fecha = now.toLocaleDateString('es-CL');
      const hora  = now.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
      const msg   = encodeURIComponent(
        `🌿 *PEDIDO — Círculo de Sabores*\n` +
        `📅 ${fecha} · ${hora}\n` +
        `─────────────────────\n` +
        `🛒 *Detalle:*\n${lines}\n` +
        `─────────────────────\n` +
        `💰 *Total: ${fmt(total)}*\n` +
        `\n_Enviado desde circulodesabores.cl_`
      );
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
    },
  };

  /* ── CATÁLOGO ──────────────────────────────────────────── */
  const CatPage = {
    init() {
      DataLayer.init();
      CatCart.load();
      CatPage.renderCategoryFilters();
      CatPage.renderTagFilters();
      CatPage.renderGrid();
      CatPage.refreshBadge();
      CatPage.refreshDeliveryBanner();

      const inp = $('#search-input');
      if (inp) inp.addEventListener('input', e => {
        CatState.searchQuery = e.target.value;
        $('#search-clear').style.display = e.target.value ? 'flex' : 'none';
        CatPage.renderGrid();
      });
    },

    refreshBadge() {
      const c  = CatCart.count();
      const nb = $('#cart-badge-nav');
      const fb = $('#foot-cart-count');
      if (nb) { nb.textContent = c; nb.classList.toggle('hidden', c === 0); }
      if (fb) { fb.textContent = c; fb.classList.toggle('hidden', c === 0); }
    },

    refreshDeliveryBanner() {
      const total    = CatCart.total();
      const isFree   = total >= DELIVERY_FREE_THRESHOLD;
      const remaining = Math.max(0, DELIVERY_FREE_THRESHOLD - total);
      const progress = Math.min(100, (total / DELIVERY_FREE_THRESHOLD) * 100);

      const banner = $('#delivery-banner');
      if (banner) banner.className = 'delivery-banner' + (isFree ? ' unlocked' : '');

      const icon = banner?.querySelector('.db-icon-wrap i');
      if (icon) icon.className = `fa-solid fa-${isFree ? 'circle-check' : 'truck'}`;

      const textEl = $('#db-text');
      if (textEl) textEl.innerHTML = isFree
        ? `<strong>¡Delivery gratis activado! 🎉</strong> Tu pedido supera los <strong style="color:var(--success)">$20.000</strong>`
        : `Agrega <strong>$${remaining.toLocaleString('es-CL')} más</strong> y activa el delivery gratis`;

      const fill = $('#db-fill');
      if (fill) fill.style.width = progress + '%';

      const label = $('#db-label');
      if (label) label.innerHTML = `$${total.toLocaleString('es-CL')} / <strong style="color:var(--success)">$20.000</strong>`;
    },

    renderCategoryFilters() {
      const wrap = $('#cat-filters');
      if (!wrap) return;
      wrap.innerHTML = Object.keys(CATEGORY_META).map(c => {
        const meta  = CATEGORY_META[c];
        const isAll = c === 'todos';
        return `<button class="filter-btn ${CatState.activeCategory === c ? 'active' : ''}" data-cat="${c}" onclick="CatPage.setCategory('${c}')">
          ${!isAll ? `<span class="filter-emoji">${meta.emoji}</span> ` : ''}${isAll ? 'Todos' : meta.label}
        </button>`;
      }).join('');
    },

    renderTagFilters() {
      const wrap = $('#tag-filters');
      if (!wrap) return;
      wrap.innerHTML = Object.entries(TAGS).map(([key, tag]) =>
        `<button class="tag-filter-btn ${CatState.activeTag === key ? 'active' : ''}" data-tag="${key}"
                 onclick="CatPage.toggleTag('${key}')" style="--tag-color:${tag.color}">
          ${tag.icon} ${tag.label}
        </button>`
      ).join('');
    },

    setCategory(cat) {
      CatState.activeCategory = cat;
      $$('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
      const lbl = $('#section-label-text');
      if (lbl) lbl.textContent = cat === 'todos' ? 'Catálogo' : (CATEGORY_META[cat]?.label || 'Catálogo');
      CatPage.renderGrid();
    },

    toggleTag(tag) {
      CatState.activeTag = CatState.activeTag === tag ? null : tag;
      $$('.tag-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === CatState.activeTag));
      CatPage.renderGrid();
    },

    clearSearch() {
      CatState.searchQuery = '';
      const inp = $('#search-input');
      if (inp) inp.value = '';
      $('#search-clear').style.display = 'none';
      CatPage.renderGrid();
    },

    clearFilters() {
      CatState.searchQuery = '';
      CatState.activeCategory = 'todos';
      CatState.activeTag = null;
      const inp = $('#search-input');
      if (inp) inp.value = '';
      $$('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'todos'));
      $$('.tag-filter-btn').forEach(b => b.classList.remove('active'));
      CatPage.renderGrid();
    },

    renderGrid() {
      const products = DataLayer.products.getActive();
      const q = CatState.searchQuery.toLowerCase();
      const filtered = products.filter(p => {
        const mC = CatState.activeCategory === 'todos' || p.category === CatState.activeCategory;
        const mT = !CatState.activeTag || (p.tags && p.tags.includes(CatState.activeTag));
        const mS = !q || p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q);
        return mC && mT && mS;
      });

      const countEl = $('#section-count');
      if (countEl) countEl.textContent = `${filtered.length} producto${filtered.length !== 1 ? 's' : ''}`;

      const grid = $('#products-grid');
      if (!grid) return;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results" style="grid-column:1/-1">
          <i class="fa-solid fa-magnifying-glass"></i>
          <p>Sin resultados${CatState.searchQuery ? ` para "<strong>${CatState.searchQuery}</strong>"` : ' para este filtro'}</p>
          <button class="btn-ghost" onclick="CatPage.clearFilters()">Limpiar filtros</button>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => CatPage._cardHTML(p)).join('');
    },

    _cardHTML(p) {
      const disc4    = Math.round((1 - p.pricePack4 / (p.priceUnit * 4)) * 100);
      const imgPath  = `images/productos/${p.id}/1.jpg`;
      const tagPills = (p.tags || []).slice(0, 2).map(t => {
        const tag = TAGS[t];
        return tag ? `<span class="card-tag-pill" style="--tag-color:${tag.color}">${tag.icon} ${tag.label}</span>` : '';
      }).join('');

      return `<div class="product-card" onclick="CatPage.openModal('${p.id}')">
        ${p.badge ? `<span class="card-badge ${p.badgeStyle || ''}">${p.badge}</span>` : ''}
        <div class="card-img-placeholder">
          <img src="${imgPath}" alt="${p.name}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
          <div class="card-img-fallback" style="display:none">
            <img src="images/logo.png" class="fallback-logo" alt=""/>
            <div class="fallback-beige-overlay"></div>
            <span class="fallback-nophoto">No-Photo</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          ${tagPills ? `<div class="card-tags">${tagPills}</div>` : ''}
          <div class="card-desc">${(p.desc || '').substring(0, 52)}…</div>
          <div class="card-pricing">
            <div class="card-price-unit">Unidad <span>${fmt(p.priceUnit)}</span></div>
            ${disc4 > 0 ? `<div class="card-price-pack"><i class="fa-solid fa-tag"></i> Pack x4 (−${disc4}%)</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="btn-card-detail" onclick="event.stopPropagation();CatPage.openModal('${p.id}')">Ver más</button>
            <button class="btn-card-add"    onclick="event.stopPropagation();CatPage.quickAdd('${p.id}')"><i class="fa-solid fa-plus"></i> Pack 4</button>
          </div>
        </div>
      </div>`;
    },

    quickAdd(id) {
      const p = DataLayer.products.getById(id);
      if (!p) return;
      CatCart.add(p, 'pack4', 1);
      showCatToast(`Pack x4 de ${p.name} agregado`, '✓');
    },

    openModal(id) {
      const p = DataLayer.products.getById(id);
      if (!p) return;
      CatState.modalProduct = p;
      CatState.modalType = 'unit';
      CatState.modalQty  = 1;
      CatPage._renderModal();
      $('#product-modal').classList.add('open');
      $('#modal-backdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
    },

    closeModal() {
      $('#product-modal').classList.remove('open');
      $('#modal-backdrop').classList.remove('open');
      document.body.style.overflow = '';
    },

    _renderModal() {
      const p    = CatState.modalProduct;
      if (!p) return;
      const type = CatState.modalType;
      const qty  = CatState.modalQty;
      const info = getPackInfo(p, type);
      const total = info.price * qty;
      const disc4 = Math.round((1 - p.pricePack4 / (p.priceUnit * 4)) * 100);
      const disc8 = Math.round((1 - p.pricePack8 / (p.priceUnit * 8)) * 100);
      const imgPath = `images/productos/${p.id}/1.jpg`;

      const tagChips = (p.tags || []).map(t => {
        const tag = TAGS[t];
        return tag ? `<span class="product-tag-chip" style="--tag-color:${tag.color}">${tag.icon} ${tag.label}</span>` : '';
      }).join('');

      const typeBtn = (t, lbl, q, price, save) =>
        `<div class="type-btn ${type === t ? 'selected' : ''}" onclick="CatPage.selectModalType('${t}')">
          <div class="tb-label">${lbl}</div>
          <div class="tb-qty">${q}</div>
          <div class="tb-price">${fmt(price)}</div>
          ${save ? `<div class="tb-save">−${save}%</div>` : ''}
        </div>`;

      const content = $('#modal-content');
      if (!content) return;

      content.innerHTML = `
        <div class="modal-img">
          <img src="${imgPath}" alt="${p.name}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
          <div class="card-img-fallback" style="display:none;width:100%;height:100%">
            <img src="images/logo.png" class="fallback-logo fallback-logo-lg" alt=""/>
            <div class="fallback-beige-overlay"></div>
            <span class="fallback-nophoto">No-Photo</span>
          </div>
        </div>
        <div class="modal-body">
          <div class="product-meta-row">
            <span class="product-category-tag">${CATEGORY_META[p.category]?.emoji || ''} ${CATEGORY_META[p.category]?.label || p.category}</span>
            ${tagChips}
          </div>
          <h2 class="product-name">${p.name}</h2>
          ${(p.attrs || []).length ? `<div class="product-attrs">${p.attrs.map(a => `<span class="product-attr-pill">${a}</span>`).join('')}</div>` : ''}
          <p class="product-desc">${p.desc}</p>
          <div class="type-selector">
            ${typeBtn('unit',  'Unidad', '1 ud.',  p.priceUnit,  0)}
            ${typeBtn('pack4', 'Pack',   '4 uds.', p.pricePack4, disc4)}
            ${typeBtn('pack8', 'Pack',   '8 uds.', p.pricePack8, disc8)}
          </div>
          <div class="counter-row">
            <span class="counter-label">Cantidad</span>
            <div class="counter">
              <button class="counter-btn" onclick="CatPage.changeModalQty(-1)">−</button>
              <span class="counter-val" id="modal-qty">${qty}</span>
              <button class="counter-btn" onclick="CatPage.changeModalQty(1)">+</button>
            </div>
          </div>
          <div class="total-row">
            <span class="tr-label">Total</span>
            <span class="tr-amount" id="modal-total">${fmt(total)}</span>
          </div>
          <button class="btn-add-full" id="modal-add-btn" onclick="CatPage.addModalToCart()">
            <i class="fa-solid fa-bag-shopping"></i>
            Agregar al carrito · ${fmt(total)}
          </button>
          <button class="btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;width:100%;cursor:pointer;padding:13px 24px"
                  onclick="CatPage.closeModal(); CartModal.open()">
            <i class="fa-solid fa-bag-shopping"></i>
            Ver carrito
          </button>
        </div>`;
    },

    selectModalType(t) {
      CatState.modalType = t;
      CatState.modalQty  = 1;
      CatPage._renderModal();
    },

    changeModalQty(delta) {
      CatState.modalQty = Math.max(1, CatState.modalQty + delta);
      const p     = CatState.modalProduct;
      const info  = getPackInfo(p, CatState.modalType);
      const total = info.price * CatState.modalQty;

      const qtyEl  = $('#modal-qty');
      const totEl  = $('#modal-total');
      const addBtn = $('#modal-add-btn');
      if (qtyEl)  qtyEl.textContent  = CatState.modalQty;
      if (totEl)  totEl.textContent  = fmt(total);
      if (addBtn) addBtn.innerHTML   = `<i class="fa-solid fa-bag-shopping"></i> Agregar al carrito · ${fmt(total)}`;
    },

    addModalToCart() {
      const p = CatState.modalProduct;
      if (!p) return;
      CatCart.add(p, CatState.modalType, CatState.modalQty);
      const labels = { unit:'1 unidad', pack4:'Pack x4', pack8:'Pack x8' };
      showCatToast(`${p.name} (${labels[CatState.modalType]}) agregado`, '🛍️');
      CatPage.closeModal();
    },
  };

  document.addEventListener('DOMContentLoaded', CatPage.init);
  </script>
</body>
</html>
